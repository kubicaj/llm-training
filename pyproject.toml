[project]
name = "llm-training"
version = "0.1.0"
description = "LLM training project (LoRA only, WSL2 + Blackwell GPU)"
requires-python = ">=3.11,<3.12"

dependencies = [
    # -------------------------
    # PyTorch (nightly required for RTX 5070 / sm_120)
    # -------------------------
    "torch",
    "torchvision",
    "torchaudio",
    "torchinfo==1.8.0",

    # -------------------------
    # Hugging Face stack
    # -------------------------
    "transformers==4.38.2",
    "datasets==2.18.0",
    "peft==0.10.0",
    "accelerate==0.28.0",

    # -------------------------
    # Utilities
    # -------------------------
    "tiktoken==0.6.0",
    "numpy==1.26.4",
    "requests==2.31.0",
    "matplotlib==3.8.3",
    "scikit-learn==1.4.2",
    "psutil==5.9.8",
    "protobuf==4.25.3",
    "tqdm==4.66.2",
]

[project.optional-dependencies]
dev = [
    "ipykernel==6.29.3",
]